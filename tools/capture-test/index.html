<!DOCTYPE html>
<html>
<head>
  <title>Nearcade Capture Test</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif;">
  <h2>Nearcade Capture Pipeline Test</h2>
  <button id="btn" style="padding:10px; font-size:16px;">Test Nearcade Pipeline (getDisplayMedia)</button>
  <pre id="log" style="background:#222; padding:10px; min-height:200px; white-space: pre-wrap;"></pre>
  <video id="vid" autoplay playsinline style="max-width:100%; max-height:400px; border:1px solid #444;"></video>

  <script>
    const { ipcRenderer } = require('electron');

    function log(msg) {
      document.getElementById('log').textContent += msg + '\n';
      console.log(msg);
    }

    ipcRenderer.on('main-log', (e, msg) => {
      log('[MAIN] ' + msg);
    });

    document.getElementById('btn').onclick = async () => {
      document.getElementById('log').textContent = '';
      try {
        log('Fetching sources...');
        const sources = await ipcRenderer.invoke('get-sources');
        
        const pickerDiv = document.createElement('div');
        pickerDiv.id = 'picker';
        pickerDiv.style.margin = '10px 0';
        pickerDiv.style.padding = '10px';
        pickerDiv.style.background = '#333';
        pickerDiv.innerHTML = '<h3>Select a Window/Screen:</h3>';
        
        sources.forEach(s => {
          const btn = document.createElement('button');
          btn.textContent = s.name;
          btn.style.margin = '5px';
          btn.style.padding = '8px';
          btn.onclick = async () => {
            document.body.removeChild(pickerDiv);
            log('Targeting: ' + s.name + ' (' + s.id + ')');
            ipcRenderer.send('set-source', s.id);
            
            try {
              log('Requesting getDisplayMedia...');
              const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 60 } }
              });
              document.getElementById('vid').srcObject = stream;
              log('SUCCESS! Capture stream started.');
            } catch (err) {
              log('FAILED: ' + err.message);
            }
          };
          pickerDiv.appendChild(btn);
        });
        
        document.body.insertBefore(pickerDiv, document.getElementById('log'));
      } catch (err) {
        log('FAILED: ' + err.message);
      }
    };
  </script>
</body>
</html>
