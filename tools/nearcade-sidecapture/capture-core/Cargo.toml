[package]
name = "capture-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform capture-card / webcam capture library built on GStreamer"

[dependencies]
gstreamer = "0.23"
gstreamer-video = "0.23"
gstreamer-app = "0.23"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
mdns-sd = "0.21.3"

[target.'cfg(target_os = "linux")'.dependencies]
# v4l2src ships in gst-plugins-good; no extra Rust crate needed to enumerate,
# we read /sys/class/video4linux directly for zero-subprocess enumeration.

[dev-dependencies]
