[package]
name = "nearcade-sidecapture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for cross-platform capture-card / webcam capture (thin wrapper over capture-core)"

[[bin]]
name = "nearcade-sidecapture"
path = "src/main.rs"

[dependencies]
capture-core = { path = "../capture-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
