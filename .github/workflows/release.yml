name: Build & Release Nearcade

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. DESKTOP BUILDS ──
  release-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Save Commit Hash
        run: echo "${{ github.sha }}" > commit.txt


      - name: Remove broken launcher symlinks
        shell: bash
        run: |
          rm -f Nearcade.cmd
          rm -f Nearcade.bat
          rm -f Nearcade.command

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # ── NEW STEP: Install Linux build tools for RPM and Pacman ──
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools fakeroot

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bin/requirements-linux.txt'

      - name: Install Compilers & Dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mkdir -p dummy_bin
            echo "@echo off" > dummy_bin/msiexec.bat
            echo "echo Skipping interactive ViGEmBus MSI installation during CI..." >> dummy_bin/msiexec.bat
            export PATH="$PWD/dummy_bin:$PATH"
            pip install nuitka pyautogui vgamepad
          elif [ "$RUNNER_OS" == "Linux" ]; then
            pip install nuitka pyautogui vgamepad
          else
            pip install nuitka pyautogui
          fi

      - name: Cache Nuitka Compiled Binaries
        id: cache-nuitka
        uses: actions/cache@v4
        with:
          path: src/sidecar/input_backends/bin/
          key: nuitka-${{ runner.os }}-${{ hashFiles('src/sidecar/input_backends/*.py') }}

      - name: Compile Sidecars
        if: steps.cache-nuitka.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p src/sidecar/input_backends/bin
          cd src/sidecar/input_backends
          if [ "$RUNNER_OS" == "macOS" ]; then
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin mac_gamepad_bridge.py
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin mac_stub.py
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin read_gamepads.py
          elif [ "$RUNNER_OS" == "Linux" ]; then
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin linux_uinput.py
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin read_gamepads.py
          else
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin windows_hidmaestro.py
            python -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin read_gamepads.py
            # Build Rust ViGEm sidecar
            echo "Building native Rust windows_vigem..."
            cd rust_vigem
            cargo build --release
            cd ..
            mv rust_vigem/target/release/rust_vigem.exe bin/windows_vigem.exe
          fi

      - name: Download Network Tunnels (Zrok & Cloudflared)
        shell: bash
        run: |
          mkdir -p bin/bin
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "Downloading Windows tunnels..."
            wget -qO bin/bin/cloudflared.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
            wget -qO bin/bin/cloudflared-x86.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-386.exe" || true
            wget -qO bin/bin/cloudflared-arm64.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-arm64.exe" || true
            
            ZROK_VER=$(curl -sL https://api.github.com/repos/openziti/zrok/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/v//' || echo "0.4.38")
            wget -qO checksums.txt "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/checksums.sha256.txt" || true
            
            wget -qO zrok_amd64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_windows_amd64.tar.gz"
            if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_windows_amd64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
            tar xzf zrok_amd64.tar.gz zrok2.exe || true
            mv zrok2.exe bin/bin/zrok2.exe || true
            rm -f zrok_amd64.tar.gz
            
            wget -qO zrok_arm64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_windows_arm64.tar.gz" || true
            if [ -f zrok_arm64.tar.gz ]; then
              if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_windows_arm64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
              tar xzf zrok_arm64.tar.gz zrok2.exe || true
              mv zrok2.exe bin/bin/zrok2-arm64.exe || true
              rm -f zrok_arm64.tar.gz
            fi
            rm -f checksums.txt
          elif [ "$RUNNER_OS" == "Linux" ]; then
            echo "Downloading Linux tunnels..."
            wget -qO bin/bin/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
            wget -qO bin/bin/cloudflared-arm64 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64" || true
            chmod +x bin/bin/cloudflared* || true
            
            ZROK_VER=$(curl -sL https://api.github.com/repos/openziti/zrok/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/v//' || echo "0.4.38")
            wget -qO checksums.txt "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/checksums.sha256.txt" || true
            
            wget -qO zrok_amd64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_linux_amd64.tar.gz" || true
            if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_linux_amd64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
            tar xzf zrok_amd64.tar.gz zrok2 || true
            mv zrok2 bin/bin/zrok2 || true
            rm -f zrok_amd64.tar.gz
            
            wget -qO zrok_arm64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_linux_arm64.tar.gz" || true
            if [ -f zrok_arm64.tar.gz ]; then
              if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_linux_arm64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
              tar xzf zrok_arm64.tar.gz zrok2 || true
              mv zrok2 bin/bin/zrok2-arm64 || true
              rm -f zrok_arm64.tar.gz
            fi
            chmod +x bin/bin/zrok2* || true
            rm -f checksums.txt
          fi

      - name: Build Electron App
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --universal --publish never
          elif [ "$RUNNER_OS" == "Linux" ]; then
            npx electron-builder --linux --publish never
          else
            npx electron-builder --win --publish never
          fi
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Place HmBridge.exe alongside the Python backends
            HM_SRC="src/sidecar/input_backends/HmBridge/HmBridge.exe"
            if [ -f "$HM_SRC" ]; then
              mkdir -p dist/win-unpacked/src/sidecar/input_backends/HmBridge/
              cp "$HM_SRC" dist/win-unpacked/src/sidecar/input_backends/HmBridge/HmBridge.exe
              echo "Packaged HmBridge.exe into release"
            else
              echo "::warning::HmBridge.exe not found at $HM_SRC — gamepad disabled"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Upload Desktop Binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            for old in dist/*.AppImage; do
              if [ -f "$old" ] && [ "$old" != "dist/Nearcade-Linux.AppImage" ]; then
                mv -f "$old" dist/Nearcade-Linux.AppImage
              fi
            done
          fi
          
          for file in dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/*.rpm dist/*.pacman dist/*.zip dist/*.yml dist/*.blockmap; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload ${{ github.ref_name }} "$file" --clobber || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}




  # ── 3. ANDROID APK BUILD ──
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Save Commit Hash
        run: echo "${{ github.sha }}" > commit.txt


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Web Assets for Android
        run: |
          chmod +x ./bin/build-android.sh
          ./bin/build-android.sh

      - name: Sync Capacitor
        working-directory: ./tools/os-installers
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap sync android

      - name: Build APK (Release)
        working-directory: ./tools/os-installers/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # ── FIX: Rename the APK before uploading ──
      - name: Rename APK
        run: mv tools/os-installers/android/app/build/outputs/apk/release/app-release.apk "Nearcade-Android.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "Nearcade-Android.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

