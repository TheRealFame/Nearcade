name: Build & Release Nearcade

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. DESKTOP BUILDS ──
  release-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Save Commit Hash
        run: echo "${{ github.sha }}" > commit.txt


      - name: Remove broken launcher symlinks
        shell: bash
        run: |
          rm -f Nearcade.cmd
          rm -f Nearcade.bat
          rm -f Nearcade.command

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # ── NEW STEP: Install Linux build tools for RPM and Pacman ──
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools fakeroot

      - name: Install Dependencies
        run: npm install

      # ── Rust sidecar builds (replaces Nuitka for Linux & macOS) ──────────────
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install Linux sidecar system deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libudev-dev libevdev-dev pkg-config

      - name: Build Rust Sidecars
        shell: bash
        run: |
          mkdir -p src/sidecar/input_backends/bin
          BIN=src/sidecar/input_backends/bin

          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "=== Building linux_uinput ==="
            cd src/sidecar/input_backends/rust_uinput && cargo build --release && cd ../../../..
            cp src/sidecar/input_backends/rust_uinput/target/release/linux_uinput $BIN/linux_uinput.bin

            echo "=== Building read_gamepads ==="
            cd src/sidecar/input_backends/rust_read_gamepads && cargo build --release && cd ../../../..
            cp src/sidecar/input_backends/rust_read_gamepads/target/release/read_gamepads $BIN/read_gamepads.bin

            echo "=== Building backend_android (Nuitka) ==="
            python3 -m pip install nuitka
            cd src/sidecar/input_backends
            python3 -m nuitka --assume-yes-for-downloads --onefile --output-dir=bin experimental/backend_android.py
            cd ../../..

          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "=== Building mac_gamepad_bridge ==="
            cd src/sidecar/input_backends/rust_mac_bridge && cargo build --release && cd ../../../..
            cp src/sidecar/input_backends/rust_mac_bridge/target/release/mac_gamepad_bridge $BIN/mac_gamepad_bridge.bin

            echo "=== Building read_gamepads ==="
            cd src/sidecar/input_backends/rust_read_gamepads && cargo build --release && cd ../../../..
            cp src/sidecar/input_backends/rust_read_gamepads/target/release/read_gamepads $BIN/read_gamepads_macos.bin

          elif [ "$RUNNER_OS" == "Windows" ]; then
            echo "=== Building windows_vigem ==="
            (cd src/sidecar/input_backends/rust_vigem && cargo build --release) && cp src/sidecar/input_backends/rust_vigem/target/release/windows_vigem.exe $BIN/windows_vigem.exe

            echo "=== Building windows_hidmaestro ==="
            (cd src/sidecar/input_backends/rust_hidmaestro && cargo build --release) && cp src/sidecar/input_backends/rust_hidmaestro/target/release/windows_hidmaestro.exe $BIN/windows_hidmaestro.exe

            echo "=== Building windows_audio_loopback ==="
            (cd src/sidecar/audio/rust_windows_audio && cargo build --release) && cp src/sidecar/audio/rust_windows_audio/target/release/windows_audio_loopback.exe src/sidecar/audio/rust_windows_audio/windows_audio_loopback.exe

            echo "=== Building read_gamepads ==="
            cd src/sidecar/input_backends/rust_read_gamepads && cargo build --release && cd ../../../..
            cp src/sidecar/input_backends/rust_read_gamepads/target/release/read_gamepads.exe $BIN/read_gamepads.exe
          fi

          echo "Sidecar binaries:"
          ls -lh $BIN/

      - name: Download Network Tunnels (Zrok & Cloudflared)
        shell: bash
        run: |
          mkdir -p bin/bin
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "Downloading Windows tunnels..."
            curl -L -o bin/bin/cloudflared.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
            curl -L -o bin/bin/cloudflared-x86.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-386.exe" || true
            curl -L -o bin/bin/cloudflared-arm64.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-arm64.exe" || true
            
            ZROK_VER=$(curl -sL https://api.github.com/repos/openziti/zrok/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/v//' || echo "0.4.38")
            curl -L -o checksums.txt "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/checksums.sha256.txt" || true
            
            curl -L -o zrok_amd64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_windows_amd64.tar.gz"
            if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_windows_amd64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
            tar xzf zrok_amd64.tar.gz zrok2.exe || true
            mv zrok2.exe bin/bin/zrok2.exe || true
            rm -f zrok_amd64.tar.gz
            
            curl -L -o zrok_arm64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_windows_arm64.tar.gz" || true
            if [ -f zrok_arm64.tar.gz ]; then
              if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_windows_arm64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
              tar xzf zrok_arm64.tar.gz zrok2.exe || true
              mv zrok2.exe bin/bin/zrok2-arm64.exe || true
              rm -f zrok_arm64.tar.gz
            fi
            rm -f checksums.txt
          elif [ "$RUNNER_OS" == "Linux" ]; then
            echo "Downloading Linux tunnels..."
            wget -qO bin/bin/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
            wget -qO bin/bin/cloudflared-arm64 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64" || true
            chmod +x bin/bin/cloudflared* || true
            
            ZROK_VER=$(curl -sL https://api.github.com/repos/openziti/zrok/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/v//' || echo "0.4.38")
            wget -qO checksums.txt "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/checksums.sha256.txt" || true
            
            wget -qO zrok_amd64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_linux_amd64.tar.gz" || true
            if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_linux_amd64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
            tar xzf zrok_amd64.tar.gz zrok2 || true
            mv zrok2 bin/bin/zrok2 || true
            rm -f zrok_amd64.tar.gz
            
            wget -qO zrok_arm64.tar.gz "https://github.com/openziti/zrok/releases/download/v${ZROK_VER}/zrok_${ZROK_VER}_linux_arm64.tar.gz" || true
            if [ -f zrok_arm64.tar.gz ]; then
              if [ -f checksums.txt ]; then grep "zrok_${ZROK_VER}_linux_arm64.tar.gz" checksums.txt | sha256sum -c - || echo "Checksum failed, continuing anyway"; fi
              tar xzf zrok_arm64.tar.gz zrok2 || true
              mv zrok2 bin/bin/zrok2-arm64 || true
              rm -f zrok_arm64.tar.gz
            fi
            chmod +x bin/bin/zrok2* || true
            rm -f checksums.txt
          fi

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"  # e.g. v3.0.6
          VERSION="${TAG#v}"  # strip leading v
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Electron App
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --x64 --arm64 --publish always
          elif [ "$RUNNER_OS" == "Linux" ]; then
            npx electron-builder --linux --publish always
          else
            npx electron-builder --win portable --publish always
          fi
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Place HmBridge.exe alongside the Python backends
            HM_SRC="src/sidecar/input_backends/HmBridge/HmBridge.exe"
            if [ -f "$HM_SRC" ]; then
              mkdir -p dist/win-unpacked/src/sidecar/input_backends/HmBridge/
              cp "$HM_SRC" dist/win-unpacked/src/sidecar/input_backends/HmBridge/HmBridge.exe
              echo "Packaged HmBridge.exe into release"
            else
              echo "::warning::HmBridge.exe not found at $HM_SRC — gamepad disabled"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── 3. ANDROID APK BUILD ──
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Save Commit Hash
        run: echo "${{ github.sha }}" > commit.txt


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install NPM dependencies
        run: npm install

      - name: Build Web Assets for Android
        run: |
          chmod +x ./bin/build-android.sh
          ./bin/build-android.sh

      - name: Sync Capacitor
        working-directory: ./tools/os-installers
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap sync android

      - name: Build APK (Release)
        working-directory: ./tools/os-installers/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # ── FIX: Rename the APK before uploading ──
      - name: Rename APK
        run: mv tools/os-installers/android/app/build/outputs/apk/release/app-release.apk "Nearcade-Android.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "Nearcade-Android.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. VERIFY UPDATER ARTIFACTS ──
  # Guards against a repeat of v3.0.5, which shipped without updater metadata
  # and broke in-app auto-update with a 404. Also enforces the normal-vs-beta
  # release marking.
  #
  # Artifact layout (electron-builder 25 / electron-updater 6):
  #  * .zsync — dead: nothing in this toolchain generates or reads it.
  #  * sidecar .blockmap — dmg (dmg-builder) + nsis/archive targets only.
  #  * AppImage — blockmap is APPENDED to the artifact itself, and the updater
  #    Range-reads that tail using size/blockMapSize from latest-linux.yml.
  verify-release-assets:
    runs-on: ubuntu-latest
    needs: [release-desktop, release-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Verify updater metadata + release marking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "verifying release $TAG ..."
          MISSING=""
          for i in $(seq 1 30); do
            ASSETS=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")' || echo "")
            echo "attempt $i: assets=[$ASSETS]"
            MISSING=""
            # Only require latest-*.yml files for platforms that generate them
            for f in latest-linux.yml latest-mac.yml; do
              case " $ASSETS " in *" $f "*) ;; *) MISSING="$MISSING $f";; esac
            done
            # Sidecar artifacts uploaded by the parallel tag workflows
            # (server/probe/turn, ~4min) — the desktop release takes ~16min,
            # so they are always present by the time this job runs. Requiring
            # them turns a silently-dropped release asset into a red run.
            for f in \
              "Nearcade-Server-${TAG}.zip" \
              "Nearcade-Gamepad-Probe-${TAG}.zip" \
              "Nearcade-Turn-${TAG}.zip" \
              "nearcade-router-x86_64-unknown-linux-gnu"; do
              case " $ASSETS " in *" $f "*) ;; *) MISSING="$MISSING $f";; esac
            done
            # Windows portable doesn't generate latest.yml (no auto-update).
            # No .zsync is ever produced — do not wait for one.
            # Sidecar .blockmap: required for mac dmg differential updates;
            # Linux has no sidecar (its blockmap is embedded, checked below).
            case " $ASSETS " in *".dmg.blockmap"*) ;; *) MISSING="$MISSING *.dmg.blockmap";; esac
            if [ -z "$MISSING" ]; then echo "all required updater assets present: $ASSETS"; break; fi
            echo "waiting for required:$MISSING (attempt $i/30)"
            sleep 20
          done
          if [ -n "$MISSING" ]; then
            echo "::error::release $TAG missing required updater artifacts:$MISSING"
            exit 1
          fi
          # Normal releases must not be marked beta, and vice versa.
          if echo "$TAG" | grep -qiE "beta|alpha|rc[0-9]"; then
            gh release edit "$TAG" --prerelease --title "$TAG (beta)" || true
            echo "tagged as pre-release (beta tag)"
          else
            gh release edit "$TAG" --prerelease=false --draft=false || true
            echo "tagged as normal release"
          fi

      # Linux differential updates do not download a sidecar .blockmap: the map
      # is appended to the AppImage (4-byte BE length + raw-deflate map) and
      # electron-updater seeks to size-(blockMapSize+4) from latest-linux.yml.
      # If those fields drift from the real file, every update silently falls
      # back to a full ~500 MB download — so probe the actual asset.
      - name: Verify AppImage embedded blockmap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");
          const https = require("https");

          const fail = (msg) => {
            console.error(`::error::${msg}`);
            process.exit(1);
          };

          const get = (url, range, hops = 0) =>
            new Promise((resolve, reject) => {
              const headers = { "User-Agent": "verify-embedded-blockmap" };
              if (range != null) headers.Range = range;
              https.get(url, { headers }, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location && hops < 5) {
                  res.resume();
                  return resolve(get(res.headers.location, range, hops + 1));
                }
                const chunks = [];
                res.on("data", (c) => chunks.push(c));
                res.on("end", () => resolve({ status: res.statusCode, headers: res.headers, body: Buffer.concat(chunks) }));
              }).on("error", reject);
            });

          (async () => {
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}`;
            const ymlRes = await get(`${base}/latest-linux.yml`, null);
            if (ymlRes.status !== 200) fail(`cannot fetch latest-linux.yml: HTTP ${ymlRes.status}`);
            const lines = ymlRes.body.toString("utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => /url:\s*\S+\.AppImage\s*$/.test(l));
            if (start < 0) fail("latest-linux.yml has no AppImage entry");
            const field = (name) => {
              for (const line of lines.slice(start, start + 8)) {
                const m = new RegExp(`^\\s+${name}:\\s*(\\d+)\\s*$`).exec(line);
                if (m) return Number(m[1]);
              }
              return null;
            };
            const size = field("size");
            const blockMapSize = field("blockMapSize");
            if (!size || !blockMapSize) {
              fail(`latest-linux.yml AppImage entry lacks size/blockMapSize (size=${size}, blockMapSize=${blockMapSize})`);
            }

            const url = `${base}/Nearcade-Linux.AppImage`;
            const head = await get(url, "bytes=0-0");
            const total = Number((head.headers["content-range"] || "/0").split("/").pop());
            if (head.status !== 206 || total !== size) {
              fail(`AppImage size mismatch: remote=${total} latest-linux.yml=${size} (HTTP ${head.status})`);
            }

            const from = size - (blockMapSize + 4);
            const tail = await get(url, `bytes=${from}-${size - 1}`);
            if (tail.status !== 206 || tail.body.length !== blockMapSize + 4) {
              fail(`unexpected blockmap tail: HTTP ${tail.status}, got ${tail.body.length} bytes, expected ${blockMapSize + 4}`);
            }
            const trailer = tail.body.readUInt32BE(tail.body.length - 4);
            if (trailer !== blockMapSize) {
              fail(`embedded blockmap trailer ${trailer} != latest-linux.yml blockMapSize ${blockMapSize}`);
            }
            let map;
            try {
              map = JSON.parse(zlib.inflateRawSync(tail.body.subarray(0, tail.body.length - 4)).toString("utf8"));
            } catch (e) {
              fail(`embedded blockmap does not inflate: ${e.message}`);
            }
            const chunks = map && map.files && map.files[0] && map.files[0].sizes ? map.files[0].sizes.length : 0;
            if (chunks === 0) fail("embedded blockmap contains no chunks");
            console.log(`embedded blockmap OK: file=${size} map=${blockMapSize} chunks=${chunks}`);
          })().catch((e) => fail(String((e && e.stack) || e)));
          NODE
