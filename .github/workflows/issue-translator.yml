name: 'issue-translator'
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: usthe/issues-translate-action@v2.7
        with:
          IS_MODIFY_TITLE: false # Decide whether to modify the issue title
          # CUSTOM_BOT_NOTE: Customize the translation robot prefix message. (optional)
          CUSTOM_BOT_NOTE: Bot detected the issue body's language is not English, translating it automatically. 🌐
