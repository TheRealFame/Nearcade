[package]
name = "rust_orchestrator"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.12.0", default-features = false, features = ["napi4"] }
napi-derive = "2.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
enigo = "0.2"

[target.'cfg(windows)'.dependencies]
vigem_client = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
uinput = "0.1"

[build-dependencies]
napi-build = "2.0"
