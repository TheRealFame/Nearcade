[package]
name = "gst-nearcade"
version = "0.1.0"
edition = "2021"
description = "Nearcade native GStreamer capture backend (Rust port of gstreamer_webrtc.py)"

[[bin]]
name = "gst-nearcade"
path = "src/main.rs"

[dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-sdp = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
