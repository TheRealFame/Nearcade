<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearcade Keyboard to Gamepad</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/scrollbars.css">
  <style>
    :root {
      --bg: #0b0d0f; --surface: #121518; --accent: #06b6d4;
      --text: #f0f3f5; --muted: #4a5157; --border: #22282d;
    }
    body {
      background: transparent; color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin: 0; padding: 14px;
      display: flex; flex-direction: column; gap: 14px;
      height: 100vh; box-sizing: border-box; overflow: hidden;
    }
    .widget-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0;
    }
    
    .v-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px;
      border-radius: 6px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 11px;
      font-weight: 600; transition: 0.2s; text-align: center;
    }
    .v-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
    .preset-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .preset-row .v-btn { flex: 1; }

    .main-area {
      display: flex; gap: 16px; flex: 1; min-height: 0;
    }

    .controller-area {
      flex: 2; position: relative; background: rgba(0,0,0,0.3);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      padding: 10px;
    }

    .sidebar {
      flex: 1; display: flex; flex-direction: column; gap: 8px;
      background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; margin-bottom: 4px;
    }

    .trigger-btn {
      background: #1a1e22; border: 1px solid var(--border);
      border-radius: 6px; padding: 10px; display: flex;
      justify-content: space-between; align-items: center;
      cursor: pointer; transition: 0.15s; font-size: 12px; font-weight: 600;
    }
    .trigger-btn:hover { background: #262c33; border-color: #3b444f; }
    .trigger-btn.waiting { background: #ffbb00; color: #000; border-color: #fff; animation: pulse 1s infinite alternate; }

    .bound-key-label {
      background: var(--accent); color: #fff; padding: 2px 6px;
      border-radius: 4px; font-size: 10px; font-family: monospace; font-weight: 700;
    }
    .trigger-btn.waiting .bound-key-label { display: none; }

    /* SVG Styling */
    .controller-svg { width: 100%; height: 100%; max-height: 250px; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5)); }
    .shell { fill: #1a1e22; stroke: var(--border); stroke-width: 2; }
    .stick-well { fill: #0b0d0f; stroke: var(--border); stroke-width: 1; }
    
    .c-btn { cursor: pointer; transition: all 0.1s; }
    .c-btn-shape { fill: #22282d; transition: fill 0.15s, filter 0.15s; }
    .c-btn:hover .c-btn-shape { fill: #333b42; filter: drop-shadow(0 0 4px rgba(255,255,255,0.2)); }
    
    .c-btn.waiting .c-btn-shape { fill: #ffbb00 !important; }
    
    .btn-text {
      font-family: monospace; font-size: 13px; font-weight: 700;
      fill: #ffffff; filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.8));
      pointer-events: none; text-anchor: middle; dominant-baseline: middle;
    }
    .c-btn.waiting .btn-text { fill: #000; filter: none; font-size: 10px; }

    /* For sticks, we use directional arrows */
    .stick-arrow { fill: var(--muted); cursor: pointer; transition: 0.1s; }
    .stick-arrow:hover { fill: var(--accent); }
    .stick-arrow.waiting { fill: #ffbb00; }

    .stick-label {
      font-family: monospace; font-size: 11px; font-weight: 700;
      fill: #ffffff; filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.8));
      pointer-events: none; text-anchor: middle; dominant-baseline: middle;
    }

    @keyframes pulse { from { opacity: 1; } to { opacity: 0.7; } }
    
    .btn-reset { color: #ff4a4a; border-color: rgba(255,74,74,0.3); }
    .btn-reset:hover { background: rgba(255, 74, 74, 0.1); border-color: #ff4a4a; }
  </style>
</head>
<body>
  <div class="widget-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:12px; font-weight:bold; color:var(--text);">Keyboard to Controller Mapping</div>
        <div style="font-size:10px; color:var(--muted);">Click any button or shoulder to bind a key.</div>
    </div>
    
    <div class="preset-row">
      <button class="v-btn" onclick="setPreset('fps')">FPS Preset</button>
      <button class="v-btn" onclick="setPreset('platformer')">Platformer</button>
      <button class="v-btn" onclick="setPreset('fighting')">Fighting Game</button>
      <button class="v-btn btn-reset" onclick="resetBinds()">Reset Defaults</button>
    </div>
    
    <div class="main-area">
      <!-- Controller Diagram -->
      <div class="controller-area">
        <svg class="controller-svg" viewBox="0 0 440 300">
          <path class="shell" d="M110,70 L330,70 C390,70 430,110 420,185 C410,240 360,260 330,250 L280,232 L160,232 L110,250 C80,260 30,240 20,185 C10,110 50,70 110,70 Z"/>
          
          <!-- Triggers (L2/R2) -->
          <g class="c-btn" data-action="KEY_O" onclick="startBind('KEY_O')">
            <path class="c-btn-shape" d="M88,16 L148,16 L148,44 L88,44 Z"/>
            <text class="btn-text" x="118" y="30"></text>
          </g>
          <g class="c-btn" data-action="KEY_P" onclick="startBind('KEY_P')">
            <path class="c-btn-shape" d="M292,16 L352,16 L352,44 L292,44 Z"/>
            <text class="btn-text" x="322" y="30"></text>
          </g>

          <!-- Bumpers (L1/R1) -->
          <g class="c-btn" data-action="KEY_U" onclick="startBind('KEY_U')">
            <rect class="c-btn-shape" x="80" y="48" width="76" height="18" rx="5"/>
            <text class="btn-text" x="118" y="57"></text>
          </g>
          <g class="c-btn" data-action="KEY_I" onclick="startBind('KEY_I')">
            <rect class="c-btn-shape" x="284" y="48" width="76" height="18" rx="5"/>
            <text class="btn-text" x="322" y="57"></text>
          </g>
          
          <!-- D-PAD (Left) -->
          <g transform="translate(100,142)">
            <g class="c-btn" data-action="KEY_UP" onclick="startBind('KEY_UP')">
              <circle class="c-btn-shape" cx="0" cy="-23" r="13"/><text class="btn-text" x="0" y="-23"></text>
            </g>
            <g class="c-btn" data-action="KEY_DOWN" onclick="startBind('KEY_DOWN')">
              <circle class="c-btn-shape" cx="0" cy="23" r="13"/><text class="btn-text" x="0" y="23"></text>
            </g>
            <g class="c-btn" data-action="KEY_LEFT" onclick="startBind('KEY_LEFT')">
              <circle class="c-btn-shape" cx="-23" cy="0" r="13"/><text class="btn-text" x="-23" y="0"></text>
            </g>
            <g class="c-btn" data-action="KEY_RIGHT" onclick="startBind('KEY_RIGHT')">
              <circle class="c-btn-shape" cx="23" cy="0" r="13"/><text class="btn-text" x="23" y="0"></text>
            </g>
          </g>

          <!-- Face Buttons (Right) -->
          <g transform="translate(340,142)">
            <g class="c-btn" data-action="KEY_K" onclick="startBind('KEY_K')">
              <circle class="c-btn-shape" cx="0" cy="-32" r="16"/><text class="btn-text" x="0" y="-32"></text>
            </g>
            <g class="c-btn" data-action="KEY_SPACE" onclick="startBind('KEY_SPACE')">
              <circle class="c-btn-shape" cx="0" cy="32" r="16"/><text class="btn-text" x="0" y="32"></text>
            </g>
            <g class="c-btn" data-action="KEY_J" onclick="startBind('KEY_J')">
              <circle class="c-btn-shape" cx="-32" cy="0" r="16"/><text class="btn-text" x="-32" y="0"></text>
            </g>
            <g class="c-btn" data-action="KEY_L" onclick="startBind('KEY_L')">
              <circle class="c-btn-shape" cx="32" cy="0" r="16"/><text class="btn-text" x="32" y="0"></text>
            </g>
          </g>

          <!-- Center Menu Buttons -->
          <g class="c-btn" data-action="KEY_TAB" onclick="startBind('KEY_TAB')">
            <rect class="c-btn-shape" x="172" y="120" width="36" height="14" rx="4"/>
            <text class="btn-text" x="190" y="128"></text>
          </g>
          <g class="c-btn" data-action="KEY_ENTER" onclick="startBind('KEY_ENTER')">
            <rect class="c-btn-shape" x="232" y="120" width="36" height="14" rx="4"/>
            <text class="btn-text" x="250" y="128"></text>
          </g>
          <g class="c-btn" data-action="KEY_ESC" onclick="startBind('KEY_ESC')">
            <circle class="c-btn-shape" cx="220" cy="100" r="16"/>
            <text class="btn-text" x="220" y="100"></text>
          </g>

          <!-- Left Stick (Movement) -->
          <g transform="translate(175,195)">
            <circle class="stick-well" cx="0" cy="0" r="36"/>
            <circle class="c-btn-shape" cx="0" cy="0" r="23" style="stroke:var(--border);stroke-width:2;"/>
            <!-- L3 Center -->
            <g class="c-btn" data-action="KEY_M" onclick="startBind('KEY_M')">
              <circle cx="0" cy="0" r="12" fill="transparent"/>
              <text class="stick-label" x="0" y="0">L3</text>
            </g>
            <!-- L-Stick Directions -->
            <g class="c-btn" data-action="KEY_W" onclick="startBind('KEY_W')">
              <path class="stick-arrow" d="M-6,-26 L6,-26 L0,-34 Z"/>
              <text class="stick-label" x="0" y="-18"></text>
            </g>
            <g class="c-btn" data-action="KEY_S" onclick="startBind('KEY_S')">
              <path class="stick-arrow" d="M-6,26 L6,26 L0,34 Z"/>
              <text class="stick-label" x="0" y="18"></text>
            </g>
            <g class="c-btn" data-action="KEY_A" onclick="startBind('KEY_A')">
              <path class="stick-arrow" d="M-26,-6 L-26,6 L-34,0 Z"/>
              <text class="stick-label" x="-18" y="0"></text>
            </g>
            <g class="c-btn" data-action="KEY_D" onclick="startBind('KEY_D')">
              <path class="stick-arrow" d="M26,-6 L26,6 L34,0 Z"/>
              <text class="stick-label" x="18" y="0"></text>
            </g>
          </g>

          <!-- Right Stick -->
          <g transform="translate(265,195)">
            <circle class="stick-well" cx="0" cy="0" r="36"/>
            <circle class="c-btn-shape" cx="0" cy="0" r="23" style="stroke:var(--border);stroke-width:2;"/>
            <!-- R3 Center -->
            <g class="c-btn" data-action="KEY_N" onclick="startBind('KEY_N')">
              <circle cx="0" cy="0" r="12" fill="transparent"/>
              <text class="stick-label" x="0" y="0">R3</text>
            </g>
          </g>
        </svg>
      </div>
      
      <!-- Right Sidebar for Triggers/Bumpers & Menu -->
      <div class="sidebar">
        <div class="sidebar-title">Shoulders & Triggers</div>
        
        <div class="trigger-btn" data-action="KEY_O" onclick="startBind('KEY_O')">
          <span>L2 (Left Trigger)</span><span class="bound-key-label"></span>
        </div>
        <div class="trigger-btn" data-action="KEY_U" onclick="startBind('KEY_U')">
          <span>L1 (Left Bumper)</span><span class="bound-key-label"></span>
        </div>
        
        <div style="height: 4px;"></div>
        
        <div class="trigger-btn" data-action="KEY_P" onclick="startBind('KEY_P')">
          <span>R2 (Right Trigger)</span><span class="bound-key-label"></span>
        </div>
        <div class="trigger-btn" data-action="KEY_I" onclick="startBind('KEY_I')">
          <span>R1 (Right Bumper)</span><span class="bound-key-label"></span>
        </div>
        
        <div style="height: 4px;"></div>
        <div class="sidebar-title">Stick Clicks</div>
        
        <div class="trigger-btn" data-action="KEY_M" onclick="startBind('KEY_M')">
          <span>L3 (Left Stick Click)</span><span class="bound-key-label"></span>
        </div>
        <div class="trigger-btn" data-action="KEY_N" onclick="startBind('KEY_N')">
          <span>R3 (Right Stick Click)</span><span class="bound-key-label"></span>
        </div>
        
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    const savedColor = localStorage.getItem('ns_chat_color');
    if (savedColor) {
        document.documentElement.style.setProperty('--accent', savedColor);
    }

    let keyMap = {};
    let waitingAction = null;

    // Helper to extract a short, readable label for standard KeyCodes
    function getShortKeyLabel(code) {
        if (!code) return '';
        let s = code.replace(/^(Key|Digit)/, '');
        if (s === 'Space') return 'SPC';
        if (s === 'Escape') return 'ESC';
        if (s === 'Backspace') return 'BKS';
        if (s === 'ShiftLeft' || s === 'ShiftRight') return 'SHF';
        if (s === 'ControlLeft' || s === 'ControlRight') return 'CTL';
        if (s === 'AltLeft' || s === 'AltRight') return 'ALT';
        if (s === 'Enter') return 'ENT';
        if (s === 'ArrowUp') return '↑';
        if (s === 'ArrowDown') return '↓';
        if (s === 'ArrowLeft') return '←';
        if (s === 'ArrowRight') return '→';
        return s.toUpperCase();
    }

    window.addEventListener('message', e => {
      if (e.data?.type === 'SYNC_KEYBINDS') {
        keyMap = e.data.map || {};
        waitingAction = null;
        renderBindings();
      }
    });

    window.parent.postMessage({ type: 'REQ_KEYBINDS' }, '*');

    function setPreset(p) { window.parent.postMessage({ type: 'SET_KEY_PRESET', preset: p }, '*'); }
    function resetBinds() { window.parent.postMessage({ type: 'RESET_KEYBINDS' }, '*'); }

    function startBind(actionStr) {
      if (waitingAction) return;
      waitingAction = actionStr;
      renderBindings();
      
      const handler = function(e) {
        e.preventDefault(); e.stopPropagation();
        document.removeEventListener('keydown', handler, true);
        
        if (e.code === 'Escape') {
            waitingAction = null;
            renderBindings();
            return;
        }
        
        let newKey = e.code;
        // Find if this action was bound to anything previously, to pass oldKey
        let oldKey = null;
        for (const [k, v] of Object.entries(keyMap)) {
            if (v === actionStr) { oldKey = k; break; }
        }
        
        window.parent.postMessage({ type: 'UPDATE_KEYBIND', oldKey: oldKey, newKey: newKey, action: actionStr }, '*');
      };
      document.addEventListener('keydown', handler, true);
    }

    function renderBindings() {
      // Create a reverse map: action -> key
      const revMap = {};
      for (const [k, v] of Object.entries(keyMap)) {
          revMap[v] = k;
      }

      // Update SVG Buttons
      document.querySelectorAll('.c-btn').forEach(el => {
          const act = el.getAttribute('data-action');
          if (waitingAction === act) {
              el.classList.add('waiting');
              const textEl = el.querySelector('.btn-text') || el.querySelector('.stick-label');
              if (textEl && act !== 'KEY_M' && act !== 'KEY_N') textEl.textContent = '...';
          } else {
              el.classList.remove('waiting');
              const textEl = el.querySelector('.btn-text') || el.querySelector('.stick-label');
              if (textEl && act !== 'KEY_M' && act !== 'KEY_N') {
                  const keyStr = getShortKeyLabel(revMap[act]) || '';
                  textEl.textContent = keyStr;
              }
          }
      });

      // Update Sidebar Buttons
      document.querySelectorAll('.trigger-btn').forEach(el => {
          const act = el.getAttribute('data-action');
          const lbl = el.querySelector('.bound-key-label');
          if (waitingAction === act) {
              el.classList.add('waiting');
              lbl.textContent = 'PRESS KEY';
          } else {
              el.classList.remove('waiting');
              lbl.textContent = getShortKeyLabel(revMap[act]) || 'NONE';
          }
      });
    }
  </script>
</body>
</html>
