<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sidecapture Settings</title>
  <style>
    :root {
      --bg: #141414;
      --bg-light: #1e1e1e;
      --accent: #ff3366;
      --text: #ffffff;
      --text-dim: #999999;
      --border: #333333;
    }
    body {
      margin: 0; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    h3 { margin-top: 0; margin-bottom: 5px; font-size: 16px; font-weight: 600; }
    p { margin: 0 0 20px 0; font-size: 12px; color: var(--text-dim); }
    
    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; font-weight: 500; }
    input[type=range] {
      width: 100%; margin: 0; -webkit-appearance: none; background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 4px; background: var(--bg-light); border-radius: 2px; border: 1px solid var(--border);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
      background: var(--text); margin-top: -6px; cursor: pointer;
    }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
    .toggle-row span { font-size: 13px; font-weight: 500; }
    
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-light); transition: .2s; border-radius: 20px; border: 1px solid var(--border); }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: var(--text-dim); transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }
    
    .reset-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; margin-top: 15px; width: 100%; text-align: center; }
    .reset-btn:hover { color: var(--text); }
  </style>
</head>
<body>
  <h3>Device Settings</h3>
  <p id="targetName">Loading...</p>

  <div class="setting-group" id="group-brightness" style="display:none;">
    <label>Brightness <span id="val-brightness">0</span></label>
    <input type="range" id="brightness" min="-100" max="100" value="0">
  </div>
  
  <div class="setting-group" id="group-contrast" style="display:none;">
    <label>Contrast <span id="val-contrast">0</span></label>
    <input type="range" id="contrast" min="-100" max="100" value="0">
  </div>

  <div class="toggle-row" id="group-mirror" style="display:none;">
    <span>Mirror Horizontal</span>
    <label class="switch">
      <input type="checkbox" id="mirror">
      <span class="slider"></span>
    </label>
  </div>

  <button class="reset-btn" onclick="resetSettings()">Reset Settings</button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const target = urlParams.get('target');
    document.getElementById('targetName').textContent = target ? target.replace('v4l2:', '') : 'Unknown Device';

    const isV4L2 = target && target.startsWith('v4l2:');

    if (isV4L2) {
      document.getElementById('group-brightness').style.display = 'block';
      document.getElementById('group-contrast').style.display = 'block';
      document.getElementById('group-mirror').style.display = 'flex';
    }

    async function sendControl(control, value) {
      try {
        await fetch('/api/sidecapture/controls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target, control, value })
        });
      } catch (e) {
        console.error('Failed to send control', e);
      }
    }

    document.getElementById('brightness').addEventListener('input', (e) => {
      document.getElementById('val-brightness').textContent = e.target.value;
      sendControl('brightness', e.target.value);
    });

    document.getElementById('contrast').addEventListener('input', (e) => {
      document.getElementById('val-contrast').textContent = e.target.value;
      sendControl('contrast', e.target.value);
    });

    document.getElementById('mirror').addEventListener('change', (e) => {
      sendControl('mirror', e.target.checked);
    });

    function resetSettings() {
      if (isV4L2) {
        document.getElementById('brightness').value = 0;
        document.getElementById('val-brightness').textContent = 0;
        sendControl('brightness', 0);
        
        document.getElementById('contrast').value = 0;
        document.getElementById('val-contrast').textContent = 0;
        sendControl('contrast', 0);
        
        document.getElementById('mirror').checked = false;
        sendControl('mirror', false);
      }
    }
  </script>
</body>
</html>
